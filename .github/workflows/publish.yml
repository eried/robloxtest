name: Publish to Roblox

on:
  workflow_dispatch:
  push:
    branches: [claude/roblox-forest-cat-game-qr4nzd]
    paths: [src/**, default.project.json, FindPianka.rbxlx, music/**, sounds/**, tools/roblox.py, .github/workflows/publish.yml]

permissions:
  contents: write

concurrency: publish

defaults:
  run:
    shell: bash

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      HAS_KEY: ${{ secrets.ROBLOX_API_KEY != '' }}
      UNIVERSE_ID: ${{ vars.UNIVERSE_ID }}
      PLACE_ID: ${{ vars.PLACE_ID }}
      ROBLOX_USERNAME: ${{ vars.ROBLOX_USERNAME }}
    steps:
      - uses: actions/checkout@v4

      - name: Check setup
        id: check
        run: |
          if [ "$HAS_KEY" != "true" ] || [ -z "$PLACE_ID" ]; then
            echo "Not set up yet. Add the ROBLOX_API_KEY secret and the PLACE_ID." | tee -a "$GITHUB_STEP_SUMMARY"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Get Rojo
        if: steps.check.outputs.ready == 'true'
        run: |
          curl -sSL -o "$RUNNER_TEMP/rojo.zip" https://github.com/rojo-rbx/rojo/releases/download/v7.4.4/rojo-7.4.4-linux-x86_64.zip
          unzip -o "$RUNNER_TEMP/rojo.zip" -d "$RUNNER_TEMP"

      - name: Upload sounds
        if: steps.check.outputs.ready == 'true'
        env:
          ROBLOX_API_KEY: ${{ secrets.ROBLOX_API_KEY }}
        run: python3 tools/roblox.py audio | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Build place
        if: steps.check.outputs.ready == 'true'
        run: |
          "$RUNNER_TEMP/rojo" build default.project.json -o FindPianka.rbxlx
          if ! git diff --quiet src/shared/Config.luau; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/shared/Config.luau FindPianka.rbxlx
            git commit -m "Set uploaded sound ids"
            git push
          fi

      - name: Publish place
        if: steps.check.outputs.ready == 'true'
        env:
          ROBLOX_API_KEY: ${{ secrets.ROBLOX_API_KEY }}
        run: python3 tools/roblox.py publish | tee -a "$GITHUB_STEP_SUMMARY"
